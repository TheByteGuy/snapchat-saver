; supervisord configuration for snapchat-saver.
;
; supervisord runs as root (so it can write to the container's stdout/stderr
; and restart programs); every program below runs as RUN_USER, which the
; entrypoint derives from PUID/PGID. All output goes to the container log
; (`docker logs`, TrueNAS app logs). Start order follows `priority`:
;   Xvfb (10) -> openbox (20) -> x11vnc (30) -> dashboard (40)
; openbox and x11vnc wait for the X socket before starting.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:xvfb]
priority=10
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp -dpi 96 +extension RANDR
user=%(ENV_RUN_USER)s
environment=HOME="%(ENV_RUN_HOME)s",USER="%(ENV_RUN_USER)s"
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
priority=20
command=/usr/local/bin/wait-for-x.sh /usr/bin/openbox --config-file /etc/snapchat-saver/openbox-rc.xml
user=%(ENV_RUN_USER)s
environment=HOME="%(ENV_RUN_HOME)s",USER="%(ENV_RUN_USER)s"
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
priority=30
; Bound to 127.0.0.1 only: the dashboard bridges its authenticated WebSocket
; to this port, so VNC is never reachable from outside the container.
command=/usr/local/bin/wait-for-x.sh /usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbport 5900 -localhost -forever -shared -nopw -noxdamage -quiet
user=%(ENV_RUN_USER)s
environment=HOME="%(ENV_RUN_HOME)s",USER="%(ENV_RUN_USER)s"
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
priority=40
command=/usr/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --timeout-graceful-shutdown 20
directory=/opt/snapchat-saver
user=%(ENV_RUN_USER)s
environment=HOME="%(ENV_RUN_HOME)s",USER="%(ENV_RUN_USER)s"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=30
; Chromium child processes are in the same group; make sure none survive.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:fatal-listener]
; If any program keeps failing to start, stop supervisord so the container
; exits and Docker's restart policy recreates a clean environment.
command=/usr/bin/python3 /usr/local/bin/fatal-listener.py
events=PROCESS_STATE_FATAL
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
